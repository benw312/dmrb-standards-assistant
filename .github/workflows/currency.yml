name: DMRB currency

# Weekly: are the indexed standards still the current versions? Fails if one has been
# superseded or withdrawn, so it shows up as a red run rather than a stale citation.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  currency:
    name: Check standards are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check against standardsforhighways.co.uk
        run: uv run python -m ingest.currency
