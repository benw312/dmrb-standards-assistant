# The DMRB documents in the index. Version and publication date are as printed in each PDF's
# page footer ("Downloaded from ... CD 109 Revision 1, published: Mar-2020").
# PDFs live in data/pdfs/ under `filename` and are git-ignored. `url` is the document's page on
# standardsforhighways.co.uk (shows its versions and whether it's withdrawn); `pdf_url` downloads
# the PDF. Both found via the site's API and checked 2026-10-26: the downloads match the local
# PDFs page for page (only the "Downloaded on" margin stamp differs).
# `uv run python -m ingest.currency` checks every entry is still the current version.
# DMRB documents: © Crown copyright, Open Government Licence v3.0.
# Loading fails while any version is still TODO.
# text_figures: figures indexed as their own chunk (flowcharts); most figures are drawings.

